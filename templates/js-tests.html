<!DOCTYPE html>
<html>
<head>
    <title>JS Unit Tests</title>
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
    <style>
        body { font-family: monospace; padding: 20px; line-height: 1.5; background: #fdfdfd; }
        .pass { color: green; }
        .fail { color: red; font-weight: bold; border-left: 3px solid red; padding-left: 5px; }
        h1 { border-bottom: 2px solid #eee; }
        .summary { margin-top: 20px; font-weight: bold; border-top: 2px solid #ccc; padding-top: 10px; font-size: 1.2rem; }
        .group-title { font-weight: bold; color: #555; text-decoration: underline; margin-top: 20px; margin-bottom: 5px; display: block; }
    </style>
</head>
<body>
    <h1>Browser Unit Tests - Serial #055</h1>
    <div id="results">Running tests...</div>
    <div id="summary" class="summary"></div>

    <script type="module">
        import { getAbsSemitone, getVariations, ACC_TO_STR } from '/static/js/spelling.js';
        import { renderControls, handleGlobalKey } from '/static/js/ui-controls.js';
        import { getNoteInfo, findPeaks } from '/static/js/audio.js';
        import { analyzeChord, ROLE_MAP } from '/static/js/theory.js';
        import { appState, syncInputsToState, syncStateToInputs, generatePermalink, loadStateFromURL, isScoreDocumentDirty, isChordDocumentDirty, syncChordToStandaloneDocument, establishFreshChordBaseline, chordDocStore, VOWEL_PRESETS_EAR as VOWEL_PRESETS } from '/static/js/state.js';
        import { triggerMutation, updateNote, manualUpdate, cycleEnharmonic, undoChordEdit, redoChordEdit, canUndoChord, canRedoChord } from '/static/js/main.js';
        import { createDocumentStore } from '/static/js/document-store.js';
        import { readScoreDocument, writeScoreDocument, SCORE_STORAGE_KEY } from '/static/js/score-store.js';
        import { readChordDocument, writeChordDocument, CHORD_STORAGE_KEY } from '/static/js/chord-store.js';
        import { parseChordName, generateVoicings, VOICING_TEMPLATES, VOICE_RANGES } from '/static/js/voicing-generator.js';

        const results = document.getElementById('results');
        const summary = document.getElementById('summary');
        let passCount = 0;
        let failCount = 0;

        function assert(condition, message) {
            const div = document.createElement('div');
            if (condition) {
                div.className = 'pass'; div.innerText = '✓ ' + message; passCount++;
            } else {
                div.className = 'fail'; div.innerText = '✕ ' + message; failCount++;
            }
            results.appendChild(div);
        }

        function group(name) {
            const div = document.createElement('div');
            div.className = 'group-title'; div.innerText = `--- ${name} ---`;
            results.appendChild(div);
        }

        async function runTests() {
            results.innerHTML = '';

            group("1. Basic Semitones & Spelling");
            assert(getAbsSemitone({step: 'c', acc: 0, oct: 4}) === 48, "C4 should be 48");
            const pref49 = getVariations(49, 4, []);
            assert(pref49[0].step === 'd' && pref49[0].acc === -1, "Prefer Db4 over C#4 in vacuum");

            group("2. False Relation Logic");
            const contextFalse = [{step: 'd', semi: 50}];
            const variationsFalse = getVariations(49, 4, contextFalse);
            assert(variationsFalse[0].step === 'c' && variationsFalse[0].acc === 1, "False Relation: Pick C#4 when D4 is present");

            const contextUnison = [{step: 'd', semi: 50}];
            const variationsUnison = getVariations(50, 4, contextUnison);
            assert(variationsUnison[0].step === 'd' && variationsUnison[0].acc === 0, "Unison: Pick D4 when another D4 is present (Not a false relation)");

            const contextCrossOctaveUnison = [{step: 'd', semi: 50}];
            const variationsCrossOctaveUnison = getVariations(62, 5, contextCrossOctaveUnison);
            assert(variationsCrossOctaveUnison[0].step === 'd' && variationsCrossOctaveUnison[0].acc === 0 && variationsCrossOctaveUnison[0].oct === 5, "Cross-octave unison: Pick D5 when a D4 is present");

            const pref47 = getVariations(47, 3, []);
            assert(pref47[0].step === 'b' && pref47[0].acc === 0, "Preference: Natural B3 preferred over Cb4");
            
            const contextAllFalse = [{step: 'd', semi: 50}, {step: 'c', semi: 48}, {step: 'b', semi: 47}];
            const variationsAll = getVariations(49, 4, contextAllFalse);
            assert(variationsAll[0].step === 'd' && variationsAll[0].acc === -1, "Tie-break: All are false relations? Default to preference (Db)");

            group("3. UI Rendering & Field IDs");
            const testContainer = document.createElement('div');
            testContainer.style.position = 'absolute'; testContainer.style.left = '-9999px';
            document.body.appendChild(testContainer);
            const mockChord = [
                { part: 'Bass', step: 'g', acc: 0, oct: 3 }, { part: 'Bari', step: 'b', acc: 0, oct: 3 }, 
                { part: 'Lead', step: 'd', acc: 0, oct: 4 }, { part: 'Tenor', step: 'f', acc: 0, oct: 4 }
            ];
            const mockPartSettings = [
                { volume: 1, mute: false }, { volume: 1, mute: false },
                { volume: 1, mute: false }, { volume: 1, mute: false }
            ];
            renderControls(testContainer, mockChord, 0, [0,0,0,0], () => {}, () => {}, () => {}, mockPartSettings);
            const noteInput0 = testContainer.querySelector('#note-input-0');
            const tuningInput0 = testContainer.querySelector('#tuning-0');
            assert(noteInput0 && tuningInput0, "UI renders predictable IDs for note and cents inputs");

            group("4. Navigation & Interaction");
            const card = testContainer.querySelector('.part-ctrl');
            card.click();
            assert(document.activeElement.tagName !== 'INPUT', "Navigation: Card click selects part but doesn't steal focus to inputs");

            let manualFlag = false;
            window.addEventListener('tuningUpdate', (e) => { if (e.detail.manual) manualFlag = true; }, {once: true});
            tuningInput0.dispatchEvent(new Event('input', { bubbles: true }));
            assert(manualFlag === true, "Tuning input correctly flags 'manual' state to trigger Custom mode");

            group("5. Key Handler & Hotkeys");
            handleGlobalKey({ key: 'a', preventDefault: () => {} }, { selectedIdx: 0, isTyping: false }, { updateNote: () => {}, navigate: () => {}, renderUI: () => {} });
            await new Promise(r => setTimeout(r, 50));
            assert(document.activeElement === noteInput0, "Hotkey [A]: Successfully focused note input");
            assert(noteInput0.value === 'A', "Hotkey [A]: Successfully replaced value");

            const tuningInput2 = testContainer.querySelector('#tuning-2');
            handleGlobalKey({ key: '1', preventDefault: () => {} }, { selectedIdx: 2, isTyping: false }, { updateNote: () => {}, navigate: () => {}, renderUI: () => {} });
            await new Promise(r => setTimeout(r, 50));
            assert(document.activeElement === tuningInput2, "Hotkey [1]: Successfully focused tuning input");
            assert(tuningInput2.value === '1', "Hotkey [1]: Successfully replaced value");

            let navigatedIdx = null;
            handleGlobalKey({ key: 'ArrowRight', preventDefault: () => {} }, { selectedIdx: 2, isTyping: false }, { navigate: (idx) => { navigatedIdx = idx; }, renderUI: () => {} });
            assert(navigatedIdx === 3, "ArrowRight: Correct voice index navigation");

            group("6. Audio DSP & WAV Logic");
            const a4 = getNoteInfo(440);
            assert(a4.note === "A4" && a4.cents === 0, "440Hz matches A4 +0c");
            
            const mockMag = new Float32Array(100).fill(-100);
            const mockFreqs = new Float32Array(100).map((_, i) => i * 10);
            mockMag[44] = -10; mockMag[43] = -25; mockMag[45] = -25; 
            const peaks = findPeaks(mockMag, mockFreqs);
            assert(peaks.length > 0 && peaks[0].freq === 440, "Peak finder: Identifies fundamental from FFT magnitudes");

            const mockBuffer = { length: 2, getChannelData: (ch) => new Float32Array([ch + 1, ch + 10]) };
            const interleaved = new Float32Array(8);
            for (let i = 0; i < 2; i++) {
                for (let ch = 0; ch < 4; ch++) interleaved[i * 4 + ch] = mockBuffer.getChannelData(ch)[i];
            }
            assert(interleaved[0] === 1 && interleaved[3] === 4 && interleaved[4] === 10, "WAV: Interleave logic sequences 4-channel data correctly");

            group("7. VLQ & fmnoise Features");
            const calcGain = (vps, vol) => vol / Math.sqrt(Math.max(1, vps));
            assert(Math.abs(calcGain(1, 0.05) - 0.05) < 0.0001, "VLQ: 1 voice at vol 0.05 yields 0.05 gain");
            assert(Math.abs(calcGain(4, 0.05) - 0.025) < 0.0001, "VLQ: 4 voices at vol 0.05 yields 0.025 gain");
            const rates = [];
            for(let i=0; i<50; i++) rates.push(4.6 + Math.random() * 1.2);
            assert(rates.every(r => r >= 4.6 && r <= 5.8), "fmnoise: Vibrato rates stay within bounds");

            group("8. Formants & Custom Vowels");
            const TEST_PRESETS = { 'ə': [500, 1500, 2500], 'ɚ': [500, 1400, 1600] };
            assert(TEST_PRESETS['ə'][1] === 1500, "Phonetics: Schwa [ə] F2 is 1500Hz");
            assert(TEST_PRESETS['ɚ'][2] === 1600, "Phonetics: Rhotic [ɚ] F3 is dropped to 1600Hz");

            group("9. Theory Engine - Gold Standard (Ported)");
            const majRes = analyzeChord(["C4", "E4", "G4"], { tuning_style: "just" });
            assert(majRes.common_name === "C-major triad", "9.1 Name: C-major triad");
            assert(majRes.inversion === "Root Position", "9.1 Inv: Root Position");
            assert(majRes.voicing === "Closed", "9.1 Voicing: Closed");
            assert(JSON.stringify(majRes.notes.map(n => n.tuning)) === "[0,-13.7,2]", "9.1 Just Tunings: [0, -13.7, 2.0]");

            const minRes = analyzeChord(["Eb3", "G3", "C4"], { tuning_style: "just" });
            assert(minRes.inversion === "1st Inversion", "9.2 Inv: 1st Inversion (Minor 3rd in Bass)");
            assert(JSON.stringify(minRes.notes.map(n => n.tuning)) === "[15.6,2,0]", "9.2 Just Tunings (C root anchor)");

            const domOpenRes = analyzeChord(["D3", "G3", "B3", "F4"], { tuning_style: "just" });
            assert(domOpenRes.voicing === "Open", "9.4 Voicing: Open (> 12 semitones)");
            assert(domOpenRes.inversion === "2nd Inversion", "9.4 Inv: 2nd Inversion (Fifth in Bass)");

            const hdRes = analyzeChord(["E3", "G3", "Bb3", "D4"], { tuning_style: "just", allow_rootless: true });
            assert(JSON.stringify(hdRes.notes.map(n => n.tuning)) === "[0,15.7,-17.5,17.6]", "9.5 Just Tunings (Rootless 9th logic)");

            const borderRes = analyzeChord(["C3", "G3", "C4"]);
            assert(borderRes.voicing === "Closed", "9.7 Voicing: Exactly 12 semitones is Closed (Even if Unknown Chord)");

            group("10. System State & UI Sync");
            testContainer.innerHTML = `
                <input type="checkbox" id="rootlessToggle"> <input type="checkbox" id="offlineToggle">
                <input type="number" id="vpsCount" value="4"> <input type="number" id="duration" value="5">
                <input type="range" id="volume" value="0.15">
                <input type="radio" name="intonation" value="just" checked> <input type="radio" name="intonation" value="equal">
                <input type="radio" name="vowel" value="u" checked>
                <input type="range" id="f1" value="300"><div id="v_f1"></div>
                <input type="range" id="f2" value="870"><div id="v_f2"></div>
                <input type="range" id="f3" value="2240"><div id="v_f3"></div>
                <input type="range" id="vibratoJitterCutoff" value="100"><div id="v_vibratoJitterCutoff"></div>
                <input type="range" id="vibratoJitterAmount" value="2.5"><div id="v_vibratoJitterAmount"></div>
                <input type="range" id="phaseJitter" value="0.08"><div id="v_phaseJitter"></div>
                <input type="range" id="vibratoDepth" value="0.006"><div id="v_vibratoDepth"></div>
                <input type="range" id="vibratoRateMean" value="5.2"><div id="v_vibratoRateMean"></div>
                <input type="range" id="vibratoRateRange" value="1.2"><div id="v_vibratoRateRange"></div>
                <input type="range" id="formantQ1" value="10"><div id="v_formantQ1"></div>
                <input type="range" id="formantQ2" value="15"><div id="v_formantQ2"></div>
                <input type="range" id="part-ping-0" value="0.25"><div id="v_part-ping-0"></div>
                <input type="range" id="part-tilt-0" value="0.5"><div id="v_part-tilt-0"></div>
                <input type="range" id="part-f4-0" value="3000"><div id="v_part-f4-0"></div>
                <input type="range" id="part-f5-0" value="5000"><div id="v_part-f5-0"></div>
            `;

            syncInputsToState();
            assert(appState.settings.volume === 0.15, "10.1 State: Volume synced from UI slider");
            assert(appState.chords[0].vowel === 'u', "10.2 State: Vowel radio synced to active chord");
            assert(appState.settings.partSettings[0].ping === 0.25, "10.2.1 State: Part ping synced");
            assert(appState.settings.partSettings[0].tilt === 0.5, "10.2.2 State: Part tilt synced");

            appState.chords[0].formants.f1 = 440;
            syncStateToInputs();
            const labelF1 = document.getElementById('v_f1');
            assert(labelF1 && labelF1.innerText === "440Hz", "10.3 UI: Slider label updated to 440Hz from State");

            group("11. Permalink Roundtrip");
            appState.chords[0].voices = [
                { part: 'Bass', step: 'a', acc: 0, oct: 3 },
                { part: 'Bari', step: 'c', acc: 0, oct: 4 },
                { part: 'Lead', step: 'e', acc: 0, oct: 4 },
                { part: 'Tenor', step: 'g', acc: 0, oct: 4 }
            ];
            appState.chords[0].tuning = [1.1, 2.2, 3.3, 4.4];
            appState.settings.intonation = 'pythagorean';
            appState.chords[0].vowel = 'custom';
            appState.chords[0].formants.f1 = 987;
            appState.ui.offlineMode = true;
            appState.settings.volume = 0.19;

            const shareBtn = document.createElement('button'); shareBtn.id = 'shareBtn';
            document.body.appendChild(shareBtn);

            generatePermalink();
            const search = decodeURIComponent(window.location.search);
            assert(search.includes('f1:987'), "11.2 URL contains target audio setting");
            assert(!search.includes('off='), "11.3 URL does not contain transient preference (offline)");
            assert(!search.includes('0.19'), "11.4 URL does not contain transient preference (volume)");

            // Reset state to check if load recovers it
            appState.chords[0].voices[0].step = 'c';
            appState.chords[0].formants.f1 = 100;

            loadStateFromURL();
            assert(appState.chords[0].voices[0].step === 'a', "11.5 State recovered target notes");
            assert(appState.chords[0].formants.f1 === 987, "11.6 State recovered target audio settings");
            assert(appState.ui.offlineMode === true, "11.7 User pref (Offline) preserved across load");
            assert(appState.settings.volume === 0.19, "11.8 User pref (Volume) preserved across load");

            group("12. Singer Formants & UI Labels");
            appState.settings.partSettings[0].f4 = 3210;
            appState.settings.partSettings[0].ping = 0.45;
            syncStateToInputs();
            const labelF4 = document.getElementById('v_part-f4-0');
            const labelPing = document.getElementById('v_part-ping-0');
            assert(labelF4 && labelF4.innerText === "3210Hz", "12.1 F4 Label updated from State");
            assert(labelPing && labelPing.innerText === "0.45", "12.2 Ping Label updated from State");

            group("13. Global Settings Persistence");
            appState.settings.duration = 2.5;
            syncStateToInputs();
            const durInput = document.getElementById('duration');
            assert(durInput && parseFloat(durInput.value) === 2.5, "13.1 Duration Input persisted in DOM");

            group("14. UI Toggles");
            const rootToggle = document.getElementById('rootlessToggle');
            const offToggle = document.getElementById('offlineToggle');
            rootToggle.checked = true;
            offToggle.checked = true;
            triggerMutation(); 
            assert(appState.ui.rootless === true, "14.1 Rootless state updated via triggerMutation");
            assert(appState.ui.offlineMode === true, "14.2 Offline state updated via triggerMutation");

            group("15. Document Store (dirty-state + undo/redo, plan.md §10.7)");
            localStorage.removeItem('test:doc-store');
            const store = createDocumentStore('test:doc-store', { undoLimit: 3 });

            let doc = store.markImported({ n: 1 }, 'imported.xml');
            assert(store.isDirty(doc) === false, "15.1 Freshly imported doc is not dirty");
            assert(doc.sourceLabel === 'imported.xml', "15.2 Import records the source label");

            doc.content = { n: 2 };
            assert(store.isDirty(doc) === true, "15.3 Mutating content makes the doc dirty");

            doc = store.markExported(doc, 'exported.xml');
            assert(store.isDirty(doc) === false, "15.4 Export clears dirty state");
            assert(doc.sourceLabel === 'exported.xml', "15.5 Export can relabel the doc");

            const neverSaved = { content: { n: 1 } };
            assert(store.isDirty(neverSaved) === true, "15.6 A doc with no sourceSnapshot yet reads as dirty");

            store.pushUndo({ n: 10 });
            store.pushUndo({ n: 11 });
            let restored = store.undo({ n: 12 });
            assert(restored.n === 11, "15.7 Undo restores the most recent pre-mutation snapshot");
            assert(store.canRedo() === true, "15.8 Undo populates the redo stack");
            const redone = store.redo({ n: 11 });
            assert(redone.n === 12, "15.9 Redo restores what undo just replaced");

            // Redo above re-pushed 11 onto the undo stack (back to [10, 11]) -- walk back twice more.
            assert(store.undo({ n: 0 }).n === 11, "15.10 Undo walks back to 11 again after the redo");
            assert(store.undo({ n: 0 }).n === 10, "15.11 Undo can keep walking back further");
            assert(store.canUndo() === false, "15.12 Undo stack empties out correctly");
            assert(store.undo({ n: 0 }) === null, "15.13 Undo on an empty stack returns null");

            store.pushUndo({ n: 'a' });
            store.pushUndo({ n: 'b' });
            store.pushUndo({ n: 'c' });
            store.pushUndo({ n: 'd' });
            let popped = [];
            while (store.canUndo()) popped.push(store.undo({}).n);
            assert(popped.join(',') === 'd,c,b', "15.14 Undo stack is bounded (oldest entry dropped past the limit)");

            store.pushUndo({ n: 1 });
            store.undo({ n: 2 });
            assert(store.canRedo() === true, "15.15 Sanity: redo available right after an undo");
            store.pushUndo({ n: 3 });
            assert(store.canRedo() === false, "15.16 A new edit clears the redo stack");

            const reimported = store.markImported({ n: 99 }, 'second.xml');
            assert(store.canUndo() === false && store.canRedo() === false, "15.17 Re-import resets undo/redo history");

            store.write(reimported);
            assert(store.read().content.n === 99, "15.18 read()/write() round-trip through localStorage");
            localStorage.removeItem('test:doc-store');

            group("16. Score-document dirty mirroring (state.js, plan.md §10.7.4)");
            const prevScoreDoc = localStorage.getItem(SCORE_STORAGE_KEY);
            localStorage.removeItem(SCORE_STORAGE_KEY);
            assert(isScoreDocumentDirty() === false, "16.1 No score document at all reads as not dirty");

            const fakeChords = [{ id: 'c1', voices: [], tuning: [0, 0, 0, 0] }];
            const fakeMeta = { keyFifths: 0, timeBeats: 4, timeBeatType: 4, measureBoundariesBeats: [4] };
            writeScoreDocument({
                chords: fakeChords,
                metadata: fakeMeta,
                sourceLabel: 'fixture.xml',
                sourceSnapshot: JSON.stringify({ chords: fakeChords, metadata: fakeMeta }),
                updatedAt: Date.now(),
            });
            assert(isScoreDocumentDirty() === false, "16.2 Content matching sourceSnapshot reads as clean");

            const edited = readScoreDocument();
            edited.chords[0].tuning = [5, 0, 0, 0];
            writeScoreDocument(edited);
            assert(isScoreDocumentDirty() === true, "16.3 Editing a chord after the snapshot reads as dirty");

            if (prevScoreDoc === null) localStorage.removeItem(SCORE_STORAGE_KEY);
            else localStorage.setItem(SCORE_STORAGE_KEY, prevScoreDoc);

            group("17. Per-field Undo/Redo wiring (main.js, plan.md §10.7.3)");
            // main.js's own DOM-event listeners (tuningUpdate/inputFocus/keydown) only get
            // attached by init(), which this test page never triggers (no #notation element) --
            // so those are verified live in a real browser instead (plan.md §10.7.7-equivalent
            // note). What's testable here without init(): the mutation functions themselves and
            // undoChordEdit/redoChordEdit, which is exactly where pushChordUndo() was wired in.
            // canUndoChord/undoChordEdit/etc. route through state.js's chordDocStore whenever
            // editingScoreChordId isn't set (plan.md §10.8.4 -- persisted, so it survives a real
            // page reload) -- that's a module-load-time singleton, not something a fresh
            // localStorage.removeItem() before this group can reset the way section 15's own
            // throwaway createDocumentStore() instance can, since it may have already rehydrated
            // from whatever a real prior visit to `/` left behind. markImported() is the only way
            // to force both its in-memory and persisted history back to empty deterministically.
            const prevChordHistory = localStorage.getItem(CHORD_STORAGE_KEY + ':history');
            chordDocStore.markImported({}, 'test-reset');
            appState.chords[0].voices[1] = { part: 'Bari', step: 'c', acc: 0, oct: 4 };
            const beforeVoices = JSON.stringify(appState.chords[0].voices);
            updateNote(1, 2);
            assert(JSON.stringify(appState.chords[0].voices) !== beforeVoices, "17.1 updateNote actually mutates the chord");
            assert(canUndoChord() === true, "17.2 updateNote pushes an undo entry");
            undoChordEdit();
            assert(JSON.stringify(appState.chords[0].voices) === beforeVoices, "17.3 Undo restores pre-edit voices");
            assert(canRedoChord() === true, "17.4 Undo populates redo");
            redoChordEdit();
            assert(JSON.stringify(appState.chords[0].voices) !== beforeVoices, "17.5 Redo re-applies the edit");
            undoChordEdit(); // drain back to a clean baseline before the next sub-test

            const beforeManual = JSON.stringify(appState.chords[0].voices);
            manualUpdate(0, 'F#3');
            assert(JSON.stringify(appState.chords[0].voices) !== beforeManual, "17.6 manualUpdate actually mutates the chord");
            undoChordEdit();
            assert(JSON.stringify(appState.chords[0].voices) === beforeManual, "17.7 Undo restores pre-manualUpdate voices");

            const beforeCycle = JSON.stringify(appState.chords[0].voices[2]);
            cycleEnharmonic(2);
            assert(JSON.stringify(appState.chords[0].voices[2]) !== beforeCycle, "17.8 cycleEnharmonic changes the spelling");
            undoChordEdit();
            assert(JSON.stringify(appState.chords[0].voices[2]) === beforeCycle, "17.9 Undo restores pre-cycle spelling");

            assert(canUndoChord() === false, "17.10 Undo stack fully drains back to empty (no leftover history)");

            group("18. Standalone chord:current document (state.js, plan.md §10.7.1)");
            const prevChordDoc = localStorage.getItem(CHORD_STORAGE_KEY);
            localStorage.removeItem(CHORD_STORAGE_KEY);
            assert(isChordDocumentDirty() === false, "18.1 No chord document at all reads as not dirty");

            appState.ui.editingScoreChordId = 'not-a-real-id'; // simulate a live ?sid= tab
            syncChordToStandaloneDocument();
            assert(readChordDocument() === null, "18.2 syncChordToStandaloneDocument is a no-op while editing a Score chord");
            appState.ui.editingScoreChordId = null;

            syncChordToStandaloneDocument();
            const afterSync = readChordDocument();
            assert(afterSync && JSON.stringify(afterSync.chord) === JSON.stringify(appState.chords[appState.activeChordIndex]), "18.3 syncChordToStandaloneDocument persists the active chord");
            assert(isChordDocumentDirty() === true, "18.4 A synced-but-never-imported/exported document reads as dirty");

            // Confirm-before-discard guard (resolved 2026-07-20 in place of a separate "undo the
            // import" mechanism): a dirty chord:current plus an incoming ?n= permalink should
            // prompt, and only overwrite the persisted document if the user says yes.
            const originalConfirm = window.confirm;
            const originalVoices = JSON.stringify(appState.chords[0].voices);
            window.confirm = () => false;
            window.history.replaceState({}, '', window.location.pathname + '?n=C4,E4,G4,C5');
            loadStateFromURL();
            assert(JSON.stringify(appState.chords[0].voices) === originalVoices, "18.5 Cancelling the discard-confirm resumes the persisted chord, ignoring the link");

            window.confirm = () => true;
            loadStateFromURL();
            assert(JSON.stringify(appState.chords[0].voices) !== originalVoices, "18.6 Confirming the discard loads the link's chord");
            assert(isChordDocumentDirty() === false, "18.7 Importing a permalink resets the dirty baseline");

            window.confirm = originalConfirm;

            group("19. Fresh-session bootstrap (main.js's init(), plan.md §10.7.9)");
            // A truly first-ever bare visit -- nothing in chord:current, no ?n=/?sid= -- must not
            // read as dirty just because the initial analysis pass computes real tuning values.
            // loadStateFromURL()'s return value is how main.js's init() knows whether that
            // bootstrap-baseline step is safe to run (only on a genuinely fresh session).
            localStorage.removeItem(CHORD_STORAGE_KEY);
            window.history.replaceState({}, '', window.location.pathname);
            assert(loadStateFromURL() === false, "19.1 A truly fresh bare visit reports 'not resumed'");

            syncChordToStandaloneDocument(); // simulate the initial analysis pass's own autosave
            assert(isChordDocumentDirty() === true, "19.2 Before establishing a baseline, that autosave reads as dirty");
            establishFreshChordBaseline();
            assert(isChordDocumentDirty() === false, "19.3 After establishing the baseline, the same content reads as clean");

            assert(loadStateFromURL() === true, "19.4 A bare visit now resumes the just-established document");

            window.history.replaceState({}, '', window.location.pathname + '?n=D4,F%234,A4,D5');
            assert(loadStateFromURL() === true, "19.5 A ?n= permalink import always reports 'resumed' (real baseline established)");

            if (prevChordDoc === null) localStorage.removeItem(CHORD_STORAGE_KEY);
            else localStorage.setItem(CHORD_STORAGE_KEY, prevChordDoc);

            if (prevChordHistory === null) localStorage.removeItem(CHORD_STORAGE_KEY + ':history');
            else localStorage.setItem(CHORD_STORAGE_KEY + ':history', prevChordHistory);

            group("20. Chord-name parsing & voicing generator (plan.md §10.9)");
            assert(JSON.stringify(parseChordName("C")) === JSON.stringify({ rootStep: 'c', rootAcc: 0, pattern: '0,4,7' }), "20.1 Bare letter parses as major");
            assert(parseChordName("Cm").pattern === '0,3,7', "20.2 'm' parses as minor");
            assert(parseChordName("C7").pattern === '0,4,7,10', "20.3 '7' parses as dominant seventh");
            assert(parseChordName("Cmaj7").pattern === '0,4,7,11', "20.4 'maj7' parses as major seventh");
            assert(parseChordName("CM7").pattern === '0,4,7,11', "20.5 'M7' (capital) also parses as major seventh");
            assert(parseChordName("Cm7").pattern === '0,3,7,10', "20.6 'm7' (lowercase) parses as minor seventh, not major");
            assert(parseChordName("Cdim7").pattern === '0,3,6,9', "20.7 'dim7' parses as diminished seventh");
            assert(parseChordName("Cm7b5").pattern === '0,3,6,10', "20.8 'm7b5' parses as half-diminished seventh");
            assert(parseChordName("C+").pattern === '0,4,8', "20.9 '+' parses as augmented");
            assert(parseChordName("C9").pattern === '0,2,4,10', "20.10 '9' parses as the no-fifth ninth");
            const bb7 = parseChordName("Bb7");
            assert(bb7.rootStep === 'b' && bb7.rootAcc === -1 && bb7.pattern === '0,4,7,10', "20.11 Flat root parses correctly");
            const fsm7 = parseChordName("F#m7");
            assert(fsm7.rootStep === 'f' && fsm7.rootAcc === 1 && fsm7.pattern === '0,3,7,10', "20.12 Sharp root parses correctly");
            assert(parseChordName("Cxyz") === null, "20.13 Unrecognized suffix returns null");
            assert(parseChordName("") === null, "20.14 Empty input returns null");

            // Every template, at every root, actually round-trips through the app's own
            // analyzeChord() as the quality it claims to be -- the same discipline the Android
            // quiz app's voicing templates were checked with (computationally, not by eye),
            // just now as a permanent regression test using the real engine instead of a
            // one-off script.
            // Derived from ROLE_MAP itself (not hand-transcribed) so this can't drift out of sync
            // with what analyzeChord() actually labels each interval -- role names are generic/
            // interval-based (e.g. an augmented triad's raised 5th comes back as "Minor 6th", the
            // same enharmonic interval, not a chord-aware "Aug 5th"), which a hand-written table
            // would be an easy place to get subtly wrong.
            const ROLE_TO_INTERVAL = Object.fromEntries(Object.entries(ROLE_MAP).map(([interval, role]) => [role, Number(interval)]));
            let templateRoundTripFailures = [];
            VOICING_TEMPLATES.forEach(template => {
                for (let root = 0; root < 12; root++) {
                    const noteStrs = template.offsets.map(o => {
                        const semi = 48 + root + o; // 48 = C4, an arbitrary comfortable baseline
                        const spelled = getVariations(semi, Math.floor(semi / 12), [])[0];
                        return spelled.step.toUpperCase() + (ACC_TO_STR[spelled.acc] || '') + spelled.oct;
                    });
                    const result = analyzeChord(noteStrs, { tuning_style: 'equal' });
                    const gotPattern = result.notes.length
                        ? [...new Set(result.notes.map(n => ROLE_TO_INTERVAL[n.role]))].sort((a, b) => a - b).join(',')
                        : null;
                    if (gotPattern !== template.pattern) {
                        templateRoundTripFailures.push(`${template.pattern} "${template.description}" root=${root}: got ${gotPattern}`);
                    }
                }
            });
            assert(templateRoundTripFailures.length === 0,
                "20.15 Every voicing template round-trips to its intended quality at every root" +
                (templateRoundTripFailures.length ? ` (failures: ${templateRoundTripFailures.slice(0, 3).join('; ')})` : ""));

            // Every template's Bass offset is the lowest and Tenor's the highest -- a real
            // structural invariant (Bari/Lead may cross, a genuine barbershop convention, so
            // that pair is deliberately NOT checked here).
            const badOrdering = VOICING_TEMPLATES.filter(t => {
                const [bass, , , tenor] = t.offsets;
                return bass !== Math.min(...t.offsets) || tenor !== Math.max(...t.offsets);
            });
            assert(badOrdering.length === 0, "20.16 Every template keeps Bass lowest and Tenor highest");

            // Unconstrained beyond quality+root, so this legitimately returns more than one
            // result per template (every valid octave placement within VOICE_RANGES counts as
            // its own candidate, by design -- different spacing/register is a real "different
            // voicing") -- what actually matters is that every result is confined to the
            // requested quality+root, and all 3 major-triad templates are represented at least
            // once each.
            const majorByName = generateVoicings({ pattern: '0,4,7', rootPc: 0 });
            const majorDescriptions = new Set(majorByName.map(v => v.description));
            assert(majorByName.every(v => v.pattern === '0,4,7' && v.rootPc === 0),
                "20.17a generateVoicings never returns a result outside the requested quality+root");
            assert(majorDescriptions.size === 3, "20.17b All 3 major-triad templates are represented");

            const noMatch = generateVoicings({ pattern: '0,4,7', rootPc: 0, fixed: [{ voice: 0, semi: 999 }] });
            assert(noMatch.length === 0, "20.18 An impossible fixed constraint returns no candidates");

            // "I know the lead sings C4" (voice index 2, semitone 48) -- every candidate returned
            // must actually have that exact pitch in that voice, and there should be at least one
            // real match (root-doubled C major has Lead on the 5th, not C, so this has to come
            // from some other quality/root/template entirely -- proves the search isn't just
            // trivially satisfied).
            const leadC4 = generateVoicings({ fixed: [{ voice: 2, semi: 48 }] });
            assert(leadC4.length > 0, "20.19 Fixing one voice's pitch finds at least one real match");
            assert(leadC4.every(v => {
                const semi = getAbsSemitone(v.voices[2]);
                return semi === 48;
            }), "20.20 Every match from a fixed-voice search actually has that voice at the fixed pitch");

            window.history.replaceState({}, '', window.location.pathname);
            document.body.removeChild(shareBtn);
            document.body.removeChild(testContainer);

            summary.innerText = `Tests: ${passCount + failCount} | Passed: ${passCount} | Failed: ${failCount}`;
            summary.style.color = failCount === 0 ? "green" : "red";
            if (failCount === 0) summary.innerText += " - ALL TESTS PASSED";
        }

        runTests();
    </script>
</body>
</html>
